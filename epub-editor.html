<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPUB 編輯工坊</title>
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
/* 版面：左欄是一本「書」（拖放、書況、輸出），右欄依工序排列設定；窄螢幕改為單欄。 */
:root {
  --bg: #EDF0F3;
  --surface: #FFFFFF;
  --ink: #18212B;
  --muted: #586473;
  --line: #D3D9E0;
  --accent: #2B6B6F;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEBEA;
  --danger: #A33A2B;
  --ok: #23704A;
  --shadow: 0 1px 2px rgba(24,33,43,.08), 0 10px 28px rgba(24,33,43,.07);
  --f-display: 'Noto Serif TC', 'Songti TC', 'PMingLiU', serif;
  --f-body: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161C; --surface: #18202A; --ink: #E5EAF0; --muted: #98A4B2; --line: #2B3541;
    --accent: #7CC3C1; --accent-ink: #0E1A1A; --accent-soft: #1E3234; --danger: #EE8B7B; --ok: #7CCB9F;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161C; --surface: #18202A; --ink: #E5EAF0; --muted: #98A4B2; --line: #2B3541;
  --accent: #7CC3C1; --accent-ink: #0E1A1A; --accent-soft: #1E3234; --danger: #EE8B7B; --ok: #7CCB9F;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.65;
}
.wrap {
  max-width: 1080px; margin: 0 auto; padding-block: 36px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1 { font-family: var(--f-display); font-size: 30px; line-height: 1.25; margin: 0 0 8px; letter-spacing: .02em; text-wrap: balance; }
.lede { margin: 0 0 32px; color: var(--muted); max-width: 40em; }
.grid { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 36px; align-items: start; }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); gap: 28px; } }

/* 左欄：書 */
.bench { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.slot {
  position: relative; aspect-ratio: 2 / 3; width: 100%; max-width: 260px;
  display: flex; align-items: center; justify-content: center; text-align: center;
  background: var(--surface); border: 2px dashed var(--line); border-radius: 4px;
  cursor: pointer; overflow: hidden; padding: 16px; color: var(--muted);
}
.slot:hover, .slot.drag { border-color: var(--accent); background: var(--accent-soft); }
.slot.has { border-style: solid; border-color: var(--line); padding: 0; box-shadow: var(--shadow); }
.slot.has::after {
  content: ""; position: absolute; inset: 0 auto 0 0; width: 12px;
  background: linear-gradient(90deg, rgba(0,0,0,.28), rgba(0,0,0,0));
}
.slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.slot .hint b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
.slot .hint span { font-size: 13px; display: block; }
.nocover { font-family: var(--f-display); font-size: 18px; padding: 20px; color: var(--ink); }
dl.facts { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; font-size: 13px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; font-family: var(--f-mono); font-size: 12.5px; overflow-wrap: anywhere; }
.btn {
  appearance: none; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  font: 500 15px/1 var(--f-body); padding: 12px 18px; border-radius: 6px; cursor: pointer; width: 100%;
}
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--accent); }
.status { margin: 0; font-size: 13px; color: var(--muted); min-height: 1.6em; overflow-wrap: anywhere; }
.status.err { color: var(--danger); }
.status.ok { color: var(--ok); }
progress { width: 100%; height: 6px; accent-color: var(--accent); }
.result { display: flex; flex-direction: column; gap: 10px; }

/* 右欄：工序 */
.steps { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
.step { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 0 14px; }
.step > .n { font-family: var(--f-mono); font-size: 13px; color: var(--accent); padding-top: 5px; }
.step h2 { font-family: var(--f-display); font-size: 18px; margin: 0 0 12px; line-height: 1.4; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 12px; }
.row > label.lab { min-width: 5.5em; color: var(--muted); font-size: 14px; }
.hintp { margin: -4px 0 12px; font-size: 13px; color: var(--muted); }
select {
  font: 400 14px var(--f-body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; max-width: 100%;
}
.chk { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; font-size: 14px; }
.chk input { margin-top: 5px; accent-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg label { position: relative; display: block; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: block; padding: 7px 14px; font-size: 14px; border-left: 1px solid var(--line); }
.seg label:first-child span { border-left: 0; }
.seg input:checked + span { background: var(--accent); color: var(--accent-ink); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pv { display: flex; justify-content: center; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; margin-top: 4px; }
.pv-text { max-width: 100%; overflow: auto; font-size: 18px; line-height: 1.7; }
.pv-text p { margin: 0; }
.pv-text p + p { margin-block-start: .5em; }
.pv.v .pv-text { writing-mode: vertical-rl; height: 190px; }
.pv-cap { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
.covrow { display: none; align-items: center; gap: 14px; margin-top: 4px; }
.covrow.on { display: flex; flex-wrap: wrap; }
.covrow img { width: 54px; height: 81px; object-fit: cover; border: 1px solid var(--line); border-radius: 2px; background: var(--surface); }
.covrow img[hidden] { display: none; }
input[type=file] { font: 400 13px var(--f-body); color: var(--muted); max-width: 100%; }
@media (prefers-reduced-motion: no-preference) { .slot { transition: border-color .15s, background .15s; } }
</style>

<div class="wrap">
  <header>
    <h1>EPUB 編輯工坊</h1>
    <p class="lede">簡體轉繁體、標點轉換、直排橫排、字型與行距、封面更換。檔案只在這個分頁裡處理，不會上傳到任何伺服器。</p>
  </header>

  <div class="grid">
    <aside class="bench">
      <input type="file" id="fileInput" accept=".epub,application/epub+zip" hidden>
      <div class="slot" id="slot" role="button" tabindex="0" aria-label="選擇或拖放 EPUB 檔案">
        <div class="hint" id="slotHint"><b>拖放 EPUB 到這裡</b><span>或點擊選擇檔案</span><span>建議 50MB 以下，手機建議 20MB 以下</span></div>
        <img id="coverImg" alt="目前封面" hidden>
        <div class="nocover" id="noCover" hidden>這本書沒有封面</div>
      </div>

      <dl class="facts">
        <dt>書名</dt><dd id="fTitle">—</dd>
        <dt>作者</dt><dd id="fAuthor">—</dd>
        <dt>大小</dt><dd id="fSize">—</dd>
        <dt>章節數</dt><dd id="fChap">—</dd>
        <dt>封面</dt><dd id="fCover">—</dd>
      </dl>

      <div class="result">
        <button class="btn" id="goBtn" disabled>輸出 EPUB</button>
        <progress id="prog" value="0" max="1" hidden></progress>
        <p class="status" id="status" role="status" aria-live="polite">先選擇一個 EPUB 檔案。</p>
        <button class="btn ghost" id="saveBtn" hidden>儲存 EPUB</button>
      </div>
    </aside>

    <main class="steps">
      <section class="step">
        <div class="n">1</div>
        <div>
          <h2>簡體轉繁體</h2>
          <div class="row">
            <label class="lab" for="s2t">轉換方式</label>
            <select id="s2t">
              <option value="off">不轉換</option>
              <option value="t">只轉換字形</option>
              <option value="tw">台灣用字</option>
              <option value="twp" selected>台灣用字＋慣用詞（軟體、記憶體）</option>
            </select>
          </div>
          <p class="hintp">書名、作者、目錄和內文都會一起轉換，語言標記改為 zh-TW。</p>
        </div>
      </section>

      <section class="step">
        <div class="n">2</div>
        <div>
          <h2>標點符號</h2>
          <label class="chk"><input type="checkbox" id="quote" checked><span>中文內的 “ ” ‘ ’ 改為 「 」 『 』</span></label>
          <label class="chk"><input type="checkbox" id="full" checked><span>中文後面的半形 , . ! ? : ; 改為全形</span></label>
        </div>
      </section>

      <section class="step">
        <div class="n">3</div>
        <div>
          <h2>排版與字型</h2>
          <div class="row">
            <span class="lab">書寫方向</span>
            <div class="seg" role="radiogroup" aria-label="書寫方向">
              <label><input type="radio" name="dir" value="keep" checked><span>保持原樣</span></label>
              <label><input type="radio" name="dir" value="v"><span>直排</span></label>
              <label><input type="radio" name="dir" value="h"><span>橫排</span></label>
            </div>
          </div>
          <div class="row">
            <label class="lab" for="font">字型風格</label>
            <select id="font">
              <option value="keep">保持原樣</option>
              <option value="serif">明體</option>
              <option value="sans" selected>黑體</option>
              <option value="kai">楷體</option>
            </select>
          </div>
          <div class="row">
            <label class="lab" for="size">字級</label>
            <select id="size">
              <option value="keep">保持原樣</option>
              <option value="90">90%</option><option value="100">100%</option><option value="110">110%</option>
              <option value="120">120%</option><option value="140">140%</option><option value="160">160%</option>
            </select>
          </div>
          <div class="row">
            <label class="lab" for="lh">行距</label>
            <select id="lh">
              <option value="keep">保持原樣</option>
              <option value="1.4">1.4</option><option value="1.6">1.6</option><option value="1.8">1.8</option>
              <option value="2">2.0</option><option value="2.4">2.4</option>
            </select>
          </div>
          <div class="row">
            <label class="lab" for="indent">首行縮排</label>
            <select id="indent">
              <option value="keep">保持原樣</option>
              <option value="0">不縮排</option><option value="1">1 字</option><option value="2" selected>2 字</option>
            </select>
          </div>
          <div class="pv" id="pv"><div class="pv-text" id="pvText"><p id="pv1"></p><p id="pv2"></p></div></div>
          <p class="pv-cap">預覽只用一小段文字示意，實際效果依閱讀器和裝置字型而定。</p>
        </div>
      </section>

      <section class="step">
        <div class="n">4</div>
        <div>
          <h2>封面</h2>
          <div class="seg" role="radiogroup" aria-label="封面處理">
            <label><input type="radio" name="cov" value="keep" checked><span>保持原樣</span></label>
            <label><input type="radio" name="cov" value="replace"><span>新增或替換</span></label>
            <label><input type="radio" name="cov" value="remove"><span>移除</span></label>
          </div>
          <div class="covrow" id="covRow">
            <img id="newCoverImg" alt="新封面預覽" hidden>
            <div>
              <input type="file" id="coverInput" accept="image/jpeg,image/png,image/gif">
              <p class="hintp" style="margin:6px 0 0">支援 JPG、PNG、GIF。</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var file = null;
  var newCover = null;
  var coverUrl = null;
  var resultBlob = null;
  var outName = 'edited.epub';

  var FONTS = {
    serif: '"Noto Serif TC","Source Han Serif TC","Noto Serif CJK TC","Songti TC","PMingLiU",serif',
    sans: '"Noto Sans TC","Source Han Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif',
    kai: '"DFKai-SB","BiauKai","Kaiti TC","STKaiti","KaiTi",serif'
  };
  var DC = 'http://purl.org/dc/elements/1.1/';
  var NF = { createFolders: false };

  /* ---------- 工具函式 ---------- */
  function fmt(n) {
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1048576).toFixed(1) + ' MB';
  }
  function say(msg, kind) {
    var s = $('status');
    s.textContent = msg;
    s.className = 'status' + (kind ? ' ' + kind : '');
  }
  function progress(v) {
    var p = $('prog');
    p.hidden = v == null;
    if (v != null) p.value = v;
  }
  function tick() { return new Promise(function (r) { setTimeout(r, 0); }); }

  function readOpts() {
    return {
      s2t: $('s2t').value,
      quote: $('quote').checked,
      full: $('full').checked,
      font: $('font').value,
      size: $('size').value,
      lh: $('lh').value,
      indent: $('indent').value,
      dir: document.querySelector('input[name=dir]:checked').value,
      cov: document.querySelector('input[name=cov]:checked').value
    };
  }

  var convCache = {};
  function getConv(mode) {
    if (typeof OpenCC === 'undefined') return null;
    if (!convCache[mode]) {
      try { convCache[mode] = OpenCC.Converter({ from: 'cn', to: mode }); }
      catch (e) { convCache[mode] = OpenCC.Converter({ from: 'cn', to: 'tw' }); }
    }
    return convCache[mode];
  }
  var CJK = /[㐀-鿿]/;
  var FW = { ',': '，', '.': '。', '!': '！', '?': '？', ':': '：', ';': '；' };
  function punct(s, o) {
    if (!CJK.test(s)) return s;
    if (o.quote) {
      s = s.replace(/“/g, '「').replace(/”/g, '」')
           .replace(/‘/g, '『').replace(/’/g, '』');
    }
    if (o.full) {
      s = s.replace(/([㐀-鿿」』）])([,.!?:;])(?=\s|$|[㐀-鿿「『（])/g,
        function (m, a, b) { return a + FW[b]; });
    }
    return s;
  }
  function makeTextFn(o) {
    var conv = o.s2t !== 'off' ? getConv(o.s2t) : null;
    return function (s) {
      if (conv) s = conv(s);
      if (o.quote || o.full) s = punct(s, o);
      return s;
    };
  }

  /* 只轉換標籤之間的文字，標籤、屬性與 style/script 原封不動 */
  function convertMarkup(str, fn) {
    var parts = str.split(/(<!--[\s\S]*?-->|<[^>]+>)/);
    var skip = false;
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (i % 2 === 1) {
        var m = p.match(/^<(\/?)(style|script)\b/i);
        if (m && !/\/>$/.test(p)) skip = !m[1];
      } else if (!skip && p.trim()) {
        parts[i] = fn(p);
      }
    }
    return parts.join('');
  }

  function joinPath(dir, href) {
    var h = href.split('#')[0];
    try { h = decodeURIComponent(h); } catch (e) {}
    var parts = (dir ? dir.split('/') : []).concat(h.split('/'));
    var out = [];
    parts.forEach(function (p) {
      if (p === '' || p === '.') return;
      if (p === '..') out.pop(); else out.push(p);
    });
    return out.join('/');
  }
  function relPath(from, to) {
    var f = from.split('/'); f.pop();
    var t = to.split('/');
    while (f.length && t.length > 1 && f[0] === t[0]) { f.shift(); t.shift(); }
    var up = '';
    for (var i = 0; i < f.length; i++) up += '../';
    return up + t.join('/');
  }
  function zipFile(z, path) {
    var f = z.file(path);
    if (f) return f;
    try { f = z.file(encodeURI(path)); } catch (e) {}
    return f || null;
  }
  function baseName(p) { return p.split('/').pop(); }
  function extOf(p) { var m = p.match(/\.([A-Za-z0-9]+)$/); return m ? m[1].toLowerCase() : ''; }

  /* ---------- 讀取 OPF ---------- */
  async function readOpf(z) {
    var cf = z.file('META-INF/container.xml');
    if (!cf) throw new Error('找不到 META-INF/container.xml，這可能不是有效的 EPUB。');
    var cx = await cf.async('string');
    var m = cx.match(/full-path\s*=\s*["']([^"']+)["']/);
    if (!m) throw new Error('container.xml 裡沒有指向 OPF 檔案。');
    var opfFile = zipFile(z, m[1]);
    if (!opfFile) throw new Error('找不到 OPF 檔案：' + m[1]);
    var text = await opfFile.async('string');
    var doc = new DOMParser().parseFromString(text, 'application/xml');
    if (doc.getElementsByTagName('parsererror').length) throw new Error('OPF 檔案無法解析。');
    var opfPath = opfFile.name;
    var opfDir = opfPath.indexOf('/') >= 0 ? opfPath.slice(0, opfPath.lastIndexOf('/')) : '';
    var items = [].map.call(doc.querySelectorAll('manifest > item'), function (el) {
      return {
        el: el,
        id: el.getAttribute('id') || '',
        href: el.getAttribute('href') || '',
        type: el.getAttribute('media-type') || '',
        props: el.getAttribute('properties') || '',
        path: joinPath(opfDir, el.getAttribute('href') || '')
      };
    });
    var cover = items.find(function (i) { return i.props.split(/\s+/).indexOf('cover-image') >= 0; });
    if (!cover) {
      var meta = doc.querySelector('metadata > meta[name="cover"]');
      if (meta) {
        var cid = meta.getAttribute('content');
        cover = items.find(function (i) { return i.id === cid && /^image\//.test(i.type); });
      }
    }
    if (!cover) cover = items.find(function (i) { return /^image\//.test(i.type) && /cover/i.test(i.id + i.href); });
    var spineCount = doc.querySelectorAll('spine > itemref').length;
    return { opfPath: opfPath, opfDir: opfDir, doc: doc, items: items, cover: cover || null, spineCount: spineCount };
  }
  function dcText(doc, name) {
    var el = doc.getElementsByTagNameNS(DC, name)[0];
    return el ? el.textContent.trim() : '';
  }

  /* ---------- 載入檔案 ---------- */
  async function loadFile(f) {
    if (!f) return;
    if (!/\.epub$/i.test(f.name)) { say('請選擇副檔名為 .epub 的檔案。', 'err'); return; }
    if (typeof JSZip === 'undefined') { say('壓縮元件沒有載入成功，請重新整理頁面。', 'err'); return; }
    say('讀取中…');
    $('saveBtn').hidden = true;
    resultBlob = null;
    try {
      var z = await JSZip.loadAsync(f);
      var info = await readOpf(z);
      file = f;
      $('fTitle').textContent = dcText(info.doc, 'title') || '（沒有書名）';
      $('fAuthor').textContent = dcText(info.doc, 'creator') || '—';
      $('fSize').textContent = fmt(f.size);
      $('fChap').textContent = String(info.spineCount);
      $('fCover').textContent = info.cover ? baseName(info.cover.path) : '沒有';
      var slot = $('slot');
      slot.classList.add('has');
      $('slotHint').hidden = true;
      if (coverUrl) { URL.revokeObjectURL(coverUrl); coverUrl = null; }
      var cf = info.cover ? zipFile(z, info.cover.path) : null;
      if (cf) {
        var cb = await cf.async('blob');
        coverUrl = URL.createObjectURL(new Blob([cb], { type: info.cover.type || 'image/jpeg' }));
        $('coverImg').src = coverUrl;
        $('coverImg').hidden = false;
        $('noCover').hidden = true;
      } else {
        $('coverImg').hidden = true;
        $('noCover').hidden = false;
      }
      $('goBtn').disabled = false;
      say('已讀取。調整右邊的設定後，按「輸出 EPUB」。');
    } catch (e) {
      file = null;
      $('goBtn').disabled = true;
      say('讀取失敗：' + (e && e.message ? e.message : e), 'err');
    }
  }

  /* ---------- 輸出 ---------- */
  function buildCss(o) {
    var L = ['/* 由 EPUB 編輯工坊產生 */'];
    var txt = 'body, p, div, span, li, blockquote, h1, h2, h3, h4, h5, h6';
    if (o.font !== 'keep') L.push(txt + ' { font-family: ' + FONTS[o.font] + ' !important; }');
    if (o.size !== 'keep') L.push('body { font-size: ' + o.size + '% !important; }');
    if (o.lh !== 'keep') L.push('body, p, div, li, blockquote { line-height: ' + o.lh + ' !important; }');
    if (o.indent !== 'keep') L.push('p { text-indent: ' + o.indent + 'em !important; }');
    if (o.dir === 'v') L.push('html, body { writing-mode: vertical-rl !important; -epub-writing-mode: vertical-rl !important; -webkit-writing-mode: vertical-rl !important; }');
    if (o.dir === 'h') L.push('html, body { writing-mode: horizontal-tb !important; -epub-writing-mode: horizontal-tb !important; -webkit-writing-mode: horizontal-tb !important; }');
    return L.length > 1 ? L.join('\n') + '\n' : null;
  }
  function injectCss(html, href) {
    var tag = '<link rel="stylesheet" type="text/css" href="' + href + '"/>';
    if (/<\/head>/i.test(html)) return html.replace(/<\/head>/i, function () { return tag + '\n</head>'; });
    return html;
  }

  async function exportEpub() {
    if (!file) return;
    var o = readOpts();
    if (o.s2t !== 'off' && typeof OpenCC === 'undefined') { say('簡繁轉換元件沒有載入成功，請重新整理頁面。', 'err'); return; }
    if (o.cov === 'replace' && !newCover) { say('封面選了「新增或替換」，請先選擇一張圖片。', 'err'); return; }
    $('goBtn').disabled = true;
    $('saveBtn').hidden = true;
    resultBlob = null;
    say('處理中…');
    progress(0);
    try {
      var z = await JSZip.loadAsync(file);
      var info = await readOpf(z);
      var doc = info.doc;
      var ns = doc.documentElement.namespaceURI;
      var manifest = doc.querySelector('manifest');
      var metadata = doc.querySelector('metadata');
      var spine = doc.querySelector('spine');
      var tfn = makeTextFn(o);
      var doText = o.s2t !== 'off' || o.quote || o.full;

      var css = buildCss(o);
      var cssPath = info.opfDir ? info.opfDir + '/epub-edit.css' : 'epub-edit.css';

      /* 封面：先決定檔名，xhtml 處理時一併更新引用 */
      var cov = info.cover;
      var renameFrom = null, renameTo = null;
      var coverReferenced = false;
      var newCoverPath = null, newCoverItemId = null;
      if (o.cov === 'replace') {
        if (cov) {
          var oe = extOf(cov.path);
          if (oe === newCover.ext || (oe === 'jpeg' && newCover.ext === 'jpg')) {
            newCoverPath = cov.path;
          } else {
            newCoverPath = cov.path.replace(/\.[A-Za-z0-9]+$/, '') + '.' + newCover.ext;
            renameFrom = baseName(cov.path);
            renameTo = baseName(newCoverPath);
          }
        } else {
          newCoverPath = info.opfDir ? info.opfDir + '/cover-image.' + newCover.ext : 'cover-image.' + newCover.ext;
        }
      }

      var targets = info.items.filter(function (i) { return /(xhtml|html|dtbncx)/i.test(i.type); });
      for (var k = 0; k < targets.length; k++) {
        var it = targets[k];
        var zf = zipFile(z, it.path);
        if (!zf) continue;
        var txt = await zf.async('string');
        if (cov && o.cov === 'remove' && txt.indexOf(baseName(cov.path)) >= 0) coverReferenced = true;
        if (doText) txt = convertMarkup(txt, tfn);
        if (o.s2t !== 'off') txt = txt.replace(/(xml:lang|lang)=(["'])zh(?:-(?:CN|Hans|SG)[^"']*)?\2/gi, '$1=$2zh-TW$2');
        if (css && /html/i.test(it.type)) txt = injectCss(txt, relPath(it.path, cssPath));
        if (renameFrom && /html/i.test(it.type)) txt = txt.split(renameFrom).join(renameTo);
        z.file(zf.name, txt, NF);
        if (k % 8 === 0) { progress(0.8 * (k / targets.length)); await tick(); }
      }

      /* OPF：書目資訊轉換 */
      if (o.s2t !== 'off') {
        ['title', 'creator', 'contributor', 'description', 'publisher', 'subject', 'rights'].forEach(function (n) {
          [].forEach.call(doc.getElementsByTagNameNS(DC, n), function (el) {
            if (!el.children.length) el.textContent = tfn(el.textContent);
          });
        });
        [].forEach.call(doc.getElementsByTagNameNS(DC, 'language'), function (el) {
          if (/^zh/i.test(el.textContent.trim())) el.textContent = 'zh-TW';
        });
      }
      if (o.dir !== 'keep' && spine) spine.setAttribute('page-progression-direction', o.dir === 'v' ? 'rtl' : 'ltr');

      if (css) {
        var ci = doc.createElementNS(ns, 'item');
        ci.setAttribute('id', 'epub-edit-css');
        ci.setAttribute('href', 'epub-edit.css');
        ci.setAttribute('media-type', 'text/css');
        manifest.appendChild(ci);
        z.file(cssPath, css, NF);
      }

      /* 封面 */
      if (o.cov === 'replace') {
        var mime = newCover.mime;
        if (cov) {
          if (newCoverPath !== cov.path) {
            var old = zipFile(z, cov.path);
            if (old) z.remove(old.name);
            cov.el.setAttribute('href', relPath(info.opfPath, newCoverPath));
          }
          cov.el.setAttribute('media-type', mime);
        } else {
          newCoverItemId = 'cover-image';
          var n = 1;
          while (info.items.some(function (i) { return i.id === newCoverItemId; })) newCoverItemId = 'cover-image-' + (n++);
          var ni = doc.createElementNS(ns, 'item');
          ni.setAttribute('id', newCoverItemId);
          ni.setAttribute('href', relPath(info.opfPath, newCoverPath));
          ni.setAttribute('media-type', mime);
          ni.setAttribute('properties', 'cover-image');
          manifest.appendChild(ni);
          var nm = doc.createElementNS(ns, 'meta');
          nm.setAttribute('name', 'cover');
          nm.setAttribute('content', newCoverItemId);
          metadata.appendChild(nm);
        }
        z.file(newCoverPath, newCover.buf, NF);
      } else if (o.cov === 'remove' && cov) {
        var props = cov.props.split(/\s+/).filter(function (p) { return p && p !== 'cover-image'; });
        if (props.length) cov.el.setAttribute('properties', props.join(' ')); else cov.el.removeAttribute('properties');
        [].forEach.call(doc.querySelectorAll('metadata > meta[name="cover"]'), function (m) { m.parentNode.removeChild(m); });
        if (!coverReferenced) {
          var rf = zipFile(z, cov.path);
          if (rf) z.remove(rf.name);
          cov.el.parentNode.removeChild(cov.el);
        }
      }

      var opfBody = new XMLSerializer().serializeToString(doc).replace(/^\s*<\?xml[^>]*\?>\s*/, '');
      var opfText = '<?xml version="1.0" encoding="UTF-8"?>\n' + opfBody;
      z.file(info.opfPath, opfText, NF);

      z.file('mimetype', 'application/epub+zip', { compression: 'STORE', createFolders: false });
      progress(0.85);
      var blob = await z.generateAsync(
        { type: 'blob', mimeType: 'application/epub+zip', compression: 'DEFLATE', compressionOptions: { level: 6 } },
        function (meta) { progress(0.85 + 0.15 * meta.percent / 100); }
      );
      resultBlob = blob;
      var baseTitle = file.name.replace(/\.epub$/i, '');
      try {
        var nameConv = getConv(o.s2t !== 'off' ? o.s2t : 'tw');
        if (nameConv) baseTitle = nameConv(baseTitle);
      } catch (e) {}
      outName = baseTitle + '_已編輯.epub';
      progress(null);
      say('完成，檔案 ' + fmt(blob.size) + '。按「儲存 EPUB」取得檔案。', 'ok');
      $('saveBtn').hidden = false;
    } catch (e) {
      progress(null);
      say('輸出失敗：' + (e && e.message ? e.message : e), 'err');
    } finally {
      $('goBtn').disabled = !file;
    }
  }

  function fallbackDownload() {
    var url = URL.createObjectURL(resultBlob);
    var a = document.createElement('a');
    a.href = url; a.download = outName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    say('已開始下載。', 'ok');
  }
  async function saveResult() {
    if (!resultBlob) return;
    var dl = null;
    try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
    if (!dl) { fallbackDownload(); return; }
    try {
      await dl.save({ filename: outName, data: resultBlob });
      say('已儲存 ' + outName + '。', 'ok');
    } catch (e) {
      if (e && e.code === 'declined') say('已取消儲存，需要時可以再按一次。');
      else say('這個檢視環境無法儲存檔案。請把頁面存成 HTML 後在瀏覽器直接開啟使用。', 'err');
    }
  }

  /* ---------- 預覽 ---------- */
  var SAMPLE1 = '“春江潮水连海平，海上明月共潮生。”';
  var SAMPLE2 = '滟滟随波千万里，何处春江无月明。';
  function updatePreview() {
    var o = readOpts();
    var t = $('pvText');
    t.style.fontFamily = o.font !== 'keep' ? FONTS[o.font] : '';
    t.style.fontSize = (18 * (o.size !== 'keep' ? Number(o.size) / 100 : 1)) + 'px';
    t.style.lineHeight = o.lh !== 'keep' ? o.lh : '1.7';
    var ind = o.indent !== 'keep' ? o.indent + 'em' : '0';
    $('pv1').style.textIndent = ind;
    $('pv2').style.textIndent = ind;
    $('pv').classList.toggle('v', o.dir === 'v');
    var fn = makeTextFn(o);
    $('pv1').textContent = fn(SAMPLE1);
    $('pv2').textContent = fn(SAMPLE2);
  }

  /* ---------- 事件 ---------- */
  var slot = $('slot');
  slot.addEventListener('click', function () { $('fileInput').click(); });
  slot.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('fileInput').click(); }
  });
  $('fileInput').addEventListener('change', function (e) { loadFile(e.target.files[0]); e.target.value = ''; });
  ['dragenter', 'dragover'].forEach(function (n) {
    slot.addEventListener(n, function (e) { e.preventDefault(); slot.classList.add('drag'); });
  });
  ['dragleave', 'drop'].forEach(function (n) {
    slot.addEventListener(n, function (e) { e.preventDefault(); slot.classList.remove('drag'); });
  });
  slot.addEventListener('drop', function (e) { loadFile(e.dataTransfer.files[0]); });

  $('goBtn').addEventListener('click', exportEpub);
  $('saveBtn').addEventListener('click', saveResult);

  ['s2t', 'quote', 'full', 'font', 'size', 'lh', 'indent'].forEach(function (id) {
    $(id).addEventListener('change', updatePreview);
  });
  [].forEach.call(document.querySelectorAll('input[name=dir]'), function (r) { r.addEventListener('change', updatePreview); });
  [].forEach.call(document.querySelectorAll('input[name=cov]'), function (r) {
    r.addEventListener('change', function () {
      $('covRow').classList.toggle('on', document.querySelector('input[name=cov]:checked').value === 'replace');
    });
  });
  $('coverInput').addEventListener('change', async function (e) {
    var f = e.target.files[0];
    if (!f) return;
    var map = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/gif': 'gif' };
    if (!map[f.type]) { say('封面請使用 JPG、PNG 或 GIF 圖片。', 'err'); e.target.value = ''; return; }
    var buf = await f.arrayBuffer();
    if (newCover && newCover.url) URL.revokeObjectURL(newCover.url);
    newCover = { buf: buf, ext: map[f.type], mime: f.type, url: URL.createObjectURL(f) };
    $('newCoverImg').src = newCover.url;
    $('newCoverImg').hidden = false;
  });

  updatePreview();
  window.addEventListener('load', updatePreview);
})();
</script>

</body>
</html>
